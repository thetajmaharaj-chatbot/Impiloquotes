name: Build WebLead Finder APK

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-weblead:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build WebLead Finder debug APK
        working-directory: weblead
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp weblead/app/build/outputs/apk/debug/app-debug.apk WebLeadFinder-v1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebLeadFinder-v1-apk
          path: WebLeadFinder-v1-debug.apk
          if-no-files-found: error
